name: Build and Publish Leziria Tools DEB

on:
  push:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fix apt cache
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        sudo apt-get update

    - name: Install build tools
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev debhelper build-essential

    - name: Prepare DEBIAN directory
      run: |
        mkdir -p build/leziria-tools
        cp -r src/* build/leziria-tools/
        cp -r DEBIAN build/leziria-tools/

    - name: Build DEB package
      run: dpkg-deb --build build/leziria-tools leziria-tools.deb

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: leziria-tools
        path: leziria-tools.deb


  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: leziria-tools
        path: repo/pool/main

    - name: Copy public key to Pages
      run: |
        mkdir -p repo/keys
        cp keys/public.key repo/keys/

    - name: Install dpkg-scanpackages
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev

    - name: Generate Packages.gz
      run: |
        cd repo
        dpkg-scanpackages --multiversion pool/main > Packages
        gzip -k -f Packages

    # ⚠️ REMOVIDO: Import GPG key
    # ⚠️ REMOVIDO: Generate Release files
    # ⚠️ REMOVIDO: Sign Release
    # Estes passos causavam warnings no apt update.

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: repo


  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy
      uses: actions/deploy-pages@v4
